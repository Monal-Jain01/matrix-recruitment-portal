<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e10600" />
    <meta
      name="description"
      content="Join MATRIX - The premier tech club for innovation, leadership, and building the future. Apply now for an incredible journey of learning and growth."
    />
    <meta name="keywords" content="MATRIX, tech club, college, recruitment, innovation, leadership, technology" />
    <meta property="og:title" content="MATRIX - Build. Lead. Innovate." />
    <meta property="og:description" content="Join the most dynamic tech club on campus. Transform your ideas into reality alongside passionate student leaders." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/matrix-og-image.jpg" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>MATRIX - Build. Lead. Innovate.</title>
    
    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
        box-shadow: 0 0 30px rgba(225, 6, 0, 0.5);
        overflow: hidden;
      }
      
      .loading-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 16px;
      }
      
      .loading-logo-fallback {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #e10600, #ff1a0d);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 18px;
        border-radius: 16px;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      .loading-text {
        color: #e10600;
        margin-top: 20px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div style="text-align: center;">
        <div class="loading-logo">
          <img src="/assets/matrixLogo.png" alt="MATRIX Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="loading-logo-fallback" style="display: none;">MATRIX</div>
        </div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
